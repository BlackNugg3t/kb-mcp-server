# ── Self-hosted GitHub Actions runner overlay ────────────────────────────
#
# Merges with docker-compose.yml so the runner joins the same kb-network
# bridge and can reach the KB server at http://kb-mcp-server:9020.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.runner.yml up -d
#   (or just run ./run.sh, which does exactly that)
#
version: "3.9"

services:
  gh-runner:
    build: ./runner
    image: gymboost-gh-runner:latest
    container_name: gh-runner
    restart: unless-stopped

    environment:
      # Repo-scoped registration. ACCESS_TOKEN is used only to mint/revoke
      # registration tokens against REPO_URL — never used as the job's own
      # GITHUB_TOKEN (that comes from GitHub itself per-job).
      - RUNNER_SCOPE=repo
      - ACCESS_TOKEN=${GH_RUNNER_PAT:?Set GH_RUNNER_PAT in .env}
      - REPO_URL=${GH_RUNNER_REPO_URL:?Set GH_RUNNER_REPO_URL in .env}
      - RUNNER_NAME=${GH_RUNNER_NAME:-gymboost-runner-01}
      - LABELS=${GH_RUNNER_LABELS:-self-hosted,linux,gymboost}
      # Persistent runner: one long-lived container processes jobs
      # sequentially rather than re-registering after every job.
      - EPHEMERAL=false
      - DISABLE_AUTO_UPDATE=true

    volumes:
      # Host Docker socket passthrough — needed by db-smoke.yml's
      # `supabase db start` (shells out to Docker for a local Postgres).
      # Tradeoff: grants this container root-equivalent access to the host
      # Docker daemon. Accepted deliberately; see kb-mcp-server AGENTS.md /
      # the runner-migration plan for the rationale.
      - /var/run/docker.sock:/var/run/docker.sock

    # Host networking, not the kb-network bridge. Containers started via the
    # passed-through socket (e.g. supabase db start's Postgres) are siblings
    # on the HOST's Docker daemon, not children nested inside this
    # container's network namespace — from a bridged gh-runner, their
    # published ports on 127.0.0.1 are unreachable (confirmed: "connection
    # refused" on 127.0.0.1:54322 despite the container starting fine).
    # Host networking makes this container's 127.0.0.1 the same as the
    # host's, so those ports just work. Reach kb-mcp-server (also
    # host-published, see docker-compose.yml) at http://localhost:9020
    # instead of the old http://kb-mcp-server:9020 service-name form.
    network_mode: host

  # Queue watcher: scales burst capacity to zero when idle. See
  # runner/watch-queue.sh for the polling logic. Shares the same image as
  # gh-runner (already has gh + docker CLI), just overrides the entrypoint.
  runner-watcher:
    build: ./runner
    image: gymboost-gh-runner:latest
    container_name: runner-watcher
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/watch-queue.sh"]

    environment:
      - ACCESS_TOKEN=${GH_RUNNER_PAT:?Set GH_RUNNER_PAT in .env}
      - REPO_URL=${GH_RUNNER_REPO_URL:?Set GH_RUNNER_REPO_URL in .env}
      - LABELS=${GH_RUNNER_LABELS:-self-hosted,linux,gymboost}
      - MAX_EXTRA_RUNNERS=${GH_RUNNER_MAX_EXTRA:-4}
      - POLL_INTERVAL_SECONDS=30

    volumes:
      # Needed to `docker run` burst runner containers on demand.
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - kb-network

networks:
  kb-network:
    # Pinned so it's always literally "kb-network" regardless of the
    # Compose project name — watch-queue.sh's `docker run --network
    # kb-network` calls run outside Compose (raw docker run against the
    # host daemon via the passed-through socket), so they need the exact
    # network name, not Compose's auto-prefixed default.
    name: kb-network
    driver: bridge
